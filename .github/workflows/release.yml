# Homepage 镜像自动构建与发布。
# 触发：推 tag v*（如 v0.1.0）→ 产出 :版本 + :latest
#       或手动 dispatch。
# 产物：ghcr.io/<owner>/homepage:<tag> 与 :latest（公开可见性首次发布后在 GHCR 设置）。
# 鉴权：用内置 GITHUB_TOKEN 推 GHCR，无需额外密钥。
#
# 注意：镜像仓库名固定为 homepage（与本仓库同名，与 compose 中 image 名一致）。
#       <owner> 由 ${{ github.repository_owner }} 决定（仓库拥有者小写）。
#       本 workflow 位于 homepage 仓库根 .github/workflows/，构建上下文即仓库根。

name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - debug      # debug 分支推送 → 构建 :debug 镜像（带详细日志，用于排查）
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/homepage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推 GHCR 所需

    steps:
      - name: 检出代码
        # 第三方 action 固定到提交 SHA（注释保留标签，便于审计/升级），
        # 防 tag 被重指向恶意版本。升级时改 SHA + 标签。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 QEMU（保留单 amd64，此步为可扩展预留）
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析 tag（vX.Y.Z → X.Y.Z）
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag v0.1.0 → :0.1.0 + :latest；手动触发 → :edge；debug 分支 → :debug
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=debug,enable=${{ github.ref == 'refs/heads/debug' }}

      - name: 构建并推送（amd64，NAS 架构）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # debug 分支用 alpine 运行时（带 sh/wget/curl，可 exec 进去）；其余用 scratch。
          file: ${{ github.ref == 'refs/heads/debug' && './Dockerfile.debug' || './Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cargo 依赖层缓存：跨 CI 运行复用。
          cache-from: type=gha
          cache-to: type=gha,mode=max
